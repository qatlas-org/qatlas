services:

  backend:
    image: qatlas/backend:${QATLAS_VERSION}
    container_name: qatlas-backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-1900}:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1024m}

    volumes:
      - ${DATA_PATH}:/app/data

    networks:
      qatlas_network:
        aliases:
          - backend
      db_network:

  classic:
    image: qatlas/frontend:${QATLAS_VERSION}
    container_name: qatlas-classic
    restart: unless-stopped

    ports:
      - "${CLASSIC_UI_PORT:-1902}:80"

    environment:
      LISTENING_PORT: 80
      BACKEND_SERVICE_NAME: backend
      BACKEND_SERVICE_PORT: 8080

    depends_on:
      - backend

    volumes:
      - ${ATTACHMENTS_PATH}:/app/data/attachments

    networks:
      qatlas_network:
        aliases:
          - qatlas-classic

  ui:
    image: qatlas/qatlas-ui:${QATLAS_VERSION}
    container_name: qatlas-ui
    restart: unless-stopped

    ports:
      - "${UI_PORT:-80}:80"

    depends_on:
      - backend
      - classic

    volumes:
      - ${ATTACHMENTS_PATH}:/app/data/attachments

    networks:
      - qatlas_network

networks:

  qatlas_network:
    external: true
    name: ${QATLAS_NETWORK}

  db_network:
    external: true
    name: ${DB_NETWORK}