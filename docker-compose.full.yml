services:

  mysql:
    image: mysql:8.0
    container_name: qatlas-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-reports_db}
      MYSQL_USER: ${DB_USER:-reports_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - qatlas_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DB_USER:-reports_user} -p${DB_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    networks:
      - qatlas_network


  adminer:
    image: adminer:4
    container_name: qatlas-adminer
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "${ADMINER_PORT:-9090}:8080"

    networks:
      - qatlas_network


  backend:
    image: qatlas/backend:${QATLAS_VERSION}
    container_name: qatlas-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-1900}:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-reports_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-reports_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1024m}

    volumes:
      - qatlas_app_data:/app/data

    networks:
      qatlas_network:
        aliases:
          - backend


  classic:
    image: qatlas/frontend:${QATLAS_VERSION}
    container_name: qatlas-classic
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${CLASSIC_UI_PORT:-1902}:80"

    environment:
      LISTENING_PORT: 80
      BACKEND_SERVICE_NAME: backend
      BACKEND_SERVICE_PORT: 8080

    volumes:
      - qatlas_app_data:/app/data

    networks:
      qatlas_network:
        aliases:
          - qatlas-classic


  ui:
    image: qatlas/qatlas-ui:${QATLAS_VERSION}
    container_name: qatlas-ui
    restart: unless-stopped

    depends_on:
      - backend
      - classic

    ports:
      - "${UI_PORT:-80}:80"

    volumes:
      - qatlas_app_data:/app/data

    networks:
      - qatlas_network


networks:
  qatlas_network:
    name: qatlas_network


volumes:
  qatlas_mysql_data:
    name: qatlas_mysql_data

  qatlas_app_data:
    name: qatlas_app_data