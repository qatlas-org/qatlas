server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container so the browser only
    # ever talks to this single origin (no CORS, no exposed backend port).
    location /rs/ {
        proxy_pass http://backend:8080/rs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Attachments (screenshots) are served by the backend itself as static
    # resources (spring.web.resources.static-locations), so we proxy the same
    # way as /rs/ rather than mounting a separate volume into this container.
    location /attachments/ {
        proxy_pass http://backend:8080/attachments/;
        proxy_set_header Host $host;
    }

    # cache hashed static assets aggressively; index.html always revalidates
    location ~* \.(?:js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
