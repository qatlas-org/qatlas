server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Classic QAtlas UI
    #
    # Keep ^~ so Classic JS/CSS/images are not intercepted by
    # the React static-asset regex further below.
    location ^~ /classic/ {
        proxy_pass http://qatlas-classic:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /rs/ {
        proxy_pass http://backend:8080/rs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Report attachments
    #
    # Example:
    # /attachment/6615/6697/.../file.json
    # ->
    # /app/data/attachments/6615/6697/.../file.json
    #
    # ^~ prevents the static asset regex below from intercepting
    # attachment files such as .jpg and .png.
    location ^~ /attachment/ {
        alias /app/data/attachments/;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache React static assets.
    location ~* \.(?:js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}