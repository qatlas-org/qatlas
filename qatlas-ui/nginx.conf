server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container.
    location /rs/ {
        proxy_pass http://backend:8080/rs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve report attachments directly from the shared attachment volume.
    #
    # Example:
    # /attachment/6615/6697/.../file.json
    # ->
    # /app/data/attachments/6615/6697/.../file.json
    #
    # ^~ prevents the static asset regex below from intercepting
    # image attachments such as .jpg and .png.
    location ^~ /attachment/ {
        alias /app/data/attachments/;
    }

    # Cache hashed static assets aggressively.
    location ~* \.(?:js|css|woff2?|svg|png|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}