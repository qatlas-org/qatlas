events{

}
http{
    include       mime.types;
    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;
        root /usr/share/nginx/html;

        #charset koi8-r;
        #access_log  /var/log/nginx/host.access.log  main;

        location / {
            index index.html;
        }

        location /attachment/ {
            root /app/data;
        }

        location /rs/ {
            proxy_pass http://backend:8080/rs/;
        }

        location /v3/ {
            proxy_pass http://backend:8080/v3/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

    }
}
