<div *ngIf="!displayApplicationForm">
    <button type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#applicationModal">Add Environment</button>
  </div>
  <hr>
  <h4>Environments</h4>
  <div class="mat-elevation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->
  
    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef > No. </th>
      <td mat-cell *matCellDef="let element;let i = index">
         <a [title] ="element.name +'details'" [routerLink]="['/environment',element.id]">
        {{i+1}}</a></td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef > Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
  
    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef > Description </th>
      <td mat-cell *matCellDef="let element"> {{element.description}} </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
    
  <div *ngIf="ackUserAction">
    <p class="text-primary">Environment added successfully!</p>
  </div>
  
  <div class="modal fade" id="applicationModal" tabindex="-1" role="dialog" aria-labelledby="applicationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header header-bg-color">
          <h5 class="modal-title" id="applicationModalLabel" style="font-size: medium;color: white;">New Environment</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <form [formGroup]="environmentForm" class="needs-validation">
        <div class="modal-body" *ngIf="!isSubmissionInProgress">
          <mat-form-field class="input-field-width">
            <mat-label>Name</mat-label>
            <input matInput  formControlName="name" >
          </mat-form-field>
  
          <mat-form-field class="input-field-width">
            <mat-label>Description</mat-label>
            <input matInput  formControlName="description" >
          </mat-form-field>
        </div>
        <div class="spinner-border text-primary" role="status" *ngIf="isSubmissionInProgress">
          <span class="sr-only">Loading...</span>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"  data-dismiss="modal" (click)="onSubmit()">Save changes</button>
        </div>
      </form>
      </div>
    </div>
  </div>
